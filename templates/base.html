<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbound Analytics Dashboard (UAD)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-body-tertiary">
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark-glass sticky-top border-bottom border-secondary border-opacity-25 px-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
                <span class="brand-icon bg-primary bg-gradient text-white rounded p-1 d-inline-flex align-items-center justify-content-center">
                    <i class="bi bi-dns-fill fs-5"></i>
                </span>
                <span>Unbound <span class="text-primary fs-6 fw-normal">Analytics</span></span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Server Selector -->
                <div class="d-flex align-items-center gap-2 ms-auto me-3 my-2 my-lg-0">
                    <label class="text-secondary small me-1"><i class="bi bi-server"></i> Server:</label>
                    <select id="serverSelect" class="form-select form-select-sm bg-dark text-light border-secondary border-opacity-50" style="min-width: 180px;">
                        <option value="all">All Servers (Aggregated)</option>
                    </select>
                    <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#addServerModal" title="Manage / Add Server">
                        <i class="bi bi-plus-lg"></i>
                    </button>
                </div>

                <!-- Action Controls -->
                <div class="d-flex align-items-center gap-2">
                    <div class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 py-2 px-3 me-2 d-flex align-items-center gap-1">
                        <span class="status-pulse bg-success"></span>
                        <span class="small fw-semibold">Port 81 Live</span>
                    </div>
                    
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-download me-1"></i> Export
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li><a class="dropdown-menu-item dropdown-item" href="/api/export/csv"><i class="bi bi-filetype-csv me-2"></i> Export to CSV</a></li>
                            <li><a class="dropdown-menu-item dropdown-item" href="/api/export/json"><i class="bi bi-filetype-json me-2"></i> Export to JSON</a></li>
                        </ul>
                    </div>
                    
                    <button class="btn btn-sm btn-outline-secondary" id="themeToggleBtn" title="Toggle Light/Dark Theme">
                        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container-fluid py-4 px-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-dark border-top border-secondary border-opacity-25 text-center text-muted small">
        <div class="container">
            <span>Unbound Analytics Dashboard &copy; 2026 | Monitoring Unbound DNS Resolvers on Port 81</span>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
