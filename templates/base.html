<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbound Analytics Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- Chart.js Zoom Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-body-tertiary">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg border-bottom border-secondary border-opacity-25 bg-body sticky-top shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold adaptive-text" href="#">
                <i class="bi bi-shield-check text-primary fs-4"></i>
                <span>Unbound Analytics</span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill fs-7 ms-1" id="appVersionBadge">{{ version }}</span>
            </a>

            <!-- Top Used Server Badge in Center Navbar Space -->
            <div class="d-none d-md-flex align-items-center gap-2 px-3 py-1 bg-body-tertiary border border-secondary border-opacity-25 rounded-pill small adaptive-muted ms-auto me-3" id="topServerIndicator" title="Most active DNS resolver by query volume">
                <i class="bi bi-trophy-fill text-warning"></i>
                <span>Top Resolver: <strong class="adaptive-text" id="topServerName">Calculating...</strong> <span class="badge bg-primary bg-opacity-25 text-primary ms-1" id="topServerQueries">0 queries</span></span>
            </div>
            
            <div class="d-flex align-items-center gap-3">
                <!-- Server Selector -->
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-body-tertiary border-secondary text-secondary">
                        <i class="bi bi-server"></i>
                    </span>
                    <select class="form-select bg-body-tertiary border-secondary adaptive-text shadow-none" id="serverSelect">
                        <option value="all">All Servers (Aggregated)</option>
                    </select>
                </div>

                <!-- Theme Toggle Button -->
                <button class="btn btn-sm btn-outline-secondary" id="themeToggleBtn" title="Toggle Light/Dark Theme">
                    <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                </button>

                <!-- Actions Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-gear-fill me-1"></i> Actions
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#addServerModal"><i class="bi bi-server me-2"></i>Manage Servers</a></li>
                        <li><a class="dropdown-item" href="/api/export/csv" target="_blank"><i class="bi bi-file-earmark-spreadsheet me-2"></i>Export CSV Data</a></li>
                        <li><a class="dropdown-item" href="/api/export/json" target="_blank"><i class="bi bi-file-earmark-code me-2"></i>Export JSON Data</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-warning" href="#" onclick="clearAlertsOnly()"><i class="bi bi-bell-slash me-2"></i>Clear Alert Logs</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container-fluid px-4 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-body border-top border-secondary border-opacity-25 text-center adaptive-muted small">
        <div class="container">
            <span>Unbound Analytics Dashboard &copy; 2026 | Monitoring Unbound DNS Resolvers on Port 81</span>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
